general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session; playerctl -a pause; wpctl set-mute @DEFAULT_AUDIO_SINK@ 1
}

# Lock the screen at 4.5 minutes (270 seconds)
listener {
    timeout = 270
    on-timeout = loginctl lock-session
}

# Suspend the PC at 5 minutes (300 seconds)
listener {
    timeout = 300
    on-timeout = systemctl suspend
}